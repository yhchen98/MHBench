---
- hosts: "{{ host }}"
  remote_user: root

  tasks:

    - name: Update APT cache
      become: true
      apt:
        update_cache: yes

    - name: Install base dependencies
      become: true
      apt:
        pkg:
          - kali-tools-top10
          - gobuster
          - wordlists
          - net-tools
          - curl
          - wget
          - sshpass
          - nmap
          - ncat
          - python3
          - python3-pip
          - nikto
          - unzip
          - ethtool
        state: present

