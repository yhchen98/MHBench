---
- name: Prepare the three-AS response services before measurement
  hosts: server:attacker-router
  remote_user: root
  become: yes
  gather_facts: no

  tasks:
    - name: Install the data-address response service
      ansible.builtin.copy:
        dest: /usr/local/sbin/mhbench-bgp-demo
        mode: '0755'
        content: |
          #!/usr/bin/env python3
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Response(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = b"{{ 'ORIGIN' if inventory_hostname == 'server' else 'ATTACKER' }}\n"
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

          HTTPServer(("198.19.0.10", 8080), Response).serve_forever()

    - name: Install the example service and attacker backing route
      ansible.builtin.copy:
        dest: /etc/systemd/system/mhbench-bgp-demo.service
        mode: '0644'
        content: |
          [Unit]
          Description=MHBench three-AS data response
          After=network.target
          [Service]
          Type=simple
          {% if inventory_hostname == 'attacker-router' %}
          ExecStartPre=/sbin/ip address replace 198.19.0.10/24 dev lo
          ExecStopPost=/sbin/ip address del 198.19.0.10/24 dev lo
          {% endif %}
          ExecStart=/usr/local/sbin/mhbench-bgp-demo

    - name: Prepare both services without advertising the attack prefix
      ansible.builtin.systemd:
        name: mhbench-bgp-demo
        daemon_reload: yes
        enabled: no
        state: restarted

    - name: Require the expected local response before taking the baseline
      ansible.builtin.uri:
        url: http://198.19.0.10:8080/
        use_proxy: no
        return_content: yes
      register: bgp_demo_response
      until: >-
        bgp_demo_response.status == 200 and
        bgp_demo_response.content | trim == ('ORIGIN' if inventory_hostname == 'server' else 'ATTACKER')
      retries: 15
      delay: 1
